<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Dashboard</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="py-4 mb-4 border-bottom">
    <div class="container d-flex align-items-center justify-content-between">
      <h1 class="mb-0">User Dashboard</h1>
      <div class="d-flex align-items-center gap-2">
        <select id="dept-select" class="form-select form-select-sm" style="width:auto;">
          <!-- populated by app.js from config.json -->
        </select>
        <button id="edit-toggle" class="btn btn-sm btn-outline-secondary">Edit</button>
      </div>
    </div>
  </header>

  <main class="container mb-5" id="main-content">
    <!-- sections and cards rendered by app.js -->
  </main>

  <!-- Hidden-cards restore banner -->
  <div id="restore-bar" class="container mb-4 d-none">
    <div class="alert alert-secondary d-flex align-items-center justify-content-between mb-0">
      <span>Some cards are hidden.</span>
      <button class="btn btn-sm btn-secondary" id="restore-all-btn">Restore all hidden cards</button>
    </div>
  </div>

  <footer class="dashboard-footer text-muted small">
    &copy; <span id="footer-year"></span> User Dashboard
    <span class="footer-controls ms-3">
      <button id="export-btn" class="btn btn-sm btn-outline-secondary footer-link">Export layout</button>
      <button id="import-btn" class="btn btn-sm btn-outline-secondary footer-link ms-2">Import layout</button>
      <input type="file" id="import-input" accept="application/json" style="display:none" />
      <button id="reset-btn" class="btn btn-sm btn-outline-secondary footer-link ms-2">Reset layout</button>
      <button id="theme-toggle" class="btn btn-sm btn-outline-secondary footer-link ms-2">Dark Mode</button>
    </span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
